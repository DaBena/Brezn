<!doctype html>
<html lang="en">
  <head>
    <!-- Brezn likes you <3 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        media-src 'self' https:;
        font-src 'self' data:;
        connect-src 'self' wss: https:;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <!--
      Header-only policies (ignored in http-equiv meta): COEP, COOP, Permissions-Policy,
      and CSP frame-ancestors (clickjacking). GitHub Pages cannot set custom response
      headers, so these are not enforceable on the current host. If you deploy behind a
      host that supports headers (e.g. Cloudflare/Netlify), set them there — e.g.
      Content-Security-Policy: frame-ancestors 'none'
      Also consider X-Frame-Options: DENY on that host.
      CSP directives that *do* work via meta (including object-src and connect-src
      without ws:/http: above) stay in the meta tag; do not put header-only directives
      into the meta CSP. Root also best-effort refuses to run inside a foreign iframe.
      <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />
      <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
      <meta http-equiv="Permissions-Policy" content="geolocation=(self)" />
    -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/brezn.svg" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Brezn" />

    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/brezn-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%icons/brezn-512.png" />

    <title>Brezn - Nostr PWA for local feeds by area</title>
    <meta
      name="description"
      content="Nostr PWA: posts by location. Geohash reduces your position to a ~5 km cell. Connect locally."
    />
    <link rel="canonical" href="https://dabena.github.io/Brezn/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dabena.github.io/Brezn/" />
    <meta property="og:title" content="Brezn - Nostr PWA for local feeds by area" />
    <meta
      property="og:description"
      content="Nostr PWA: posts by location. Geohash reduces your position to a ~5 km cell. Connect locally."
    />
    <meta property="og:image" content="https://dabena.github.io/Brezn/icons/brezn-512.png" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Brezn - Nostr PWA for local feeds by area" />
    <meta
      name="twitter:description"
      content="Nostr PWA: posts by location. Geohash reduces your position to a ~5 km cell. Connect locally."
    />
    <meta name="twitter:image" content="https://dabena.github.io/Brezn/icons/brezn-512.png" />

    <script type="application/ld+json" src="%BASE_URL%schema.jsonld"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="%BASE_URL%fatal-handler.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
